# CPU-only conda env for the ClimX project (aarch64 WSL2).
# Trimmed from the starter kit's environment.yml: torch-geometric/networkx (GNN,
# deferred), esmpy/xesmf (not imported by the climatology/LPS/FFNN code paths).
# conda-forge only — 'defaults' has spotty aarch64 coverage.
name: climx
channels:
  - conda-forge
dependencies:
  - python=3.11
  - xarray=2024.07.0
  - dask=2024.08.1
  - numpy=2.1.1
  - pandas=2.2.3
  - scikit-learn=1.5.2
  - joblib=1.4.2
  - scipy=1.13.1
  - netcdf4=1.7.1
  - h5netcdf=1.3.0
  - zarr=2.18.2
  - cftime=1.6.4
  - numcodecs=0.13.0
  - matplotlib=3.9.2
  - seaborn=0.13.2
  # cartopy must stay: the starter's src/visualization/utils.py imports it at
  # module level, so dropping it breaks `import src.models.*`.
  - cartopy
  - nc-time-axis=1.4.1
  - tqdm
  - bottleneck
  - ipykernel=6.29.5
  - pint=0.25.2
  - pyarrow=17.0.0
  - numba
  - llvmlite
  - cf-xarray=0.10.8
  - boltons=25.0.0
  - pooch=1.8.2
  - xclim=0.59.1
  - tabulate
  - markdown
  - pip
  - pip:
      - torch==2.9.0
      - pytorch-lightning==2.5.6
      - lightning==2.5.6
      - torchmetrics==1.8.2
      - pint-xarray
      - pint-pandas
      - huggingface_hub
      - hydra-core==1.3.2
      - kaggle
