# FFNN baseline: the starter's per-pixel MLP (PyTorch Lightning).
# n_forcing_vars=22 is correct after the aerosol triple-split (the starter's
# train.py still says 12 — stale). n_lat/n_lon stay 192/288 even on lite: the
# spatial embedding is sized for the full grid.
name: ffnn
runner:
  _target_: climx_project.runners.ffnn.run
seed: 42
model:
  _target_: src.models.nn_model.NNBaseline
  model_params:
    n_lat: 192
    n_lon: 288
    n_forcing_vars: 22
    n_target_vars: 7
    learning_rate: 0.001
    separate_output_heads: true
trainer:
  max_epochs: 5
  num_workers: 0
  # NOTE: 'pixel_batch' cannot be set here — NNBaseline.fit reads it for its
  # datasets but fails to pop it before pl.Trainer(**params) (starter bug).
  # The 4096 default exceeds the lite grid's 216 pixels, so it is a no-op
  # on lite anyway.

# Experiment monitoring (see src/climx_project/monitoring.py).
#   backend: wandb        -> cloud dashboard; auto-offline without WANDB_API_KEY
#                            (runs land in results/runs/wandb/, sync later)
#   backend: tensorboard  -> LOCAL browser dashboard, no network needed:
#                            tensorboard --logdir results/runs/tensorboard
#                            then open http://localhost:6006
#   backend: none         -> disable
logger:
  backend: tensorboard
  project: climx-lite
  name: ffnn

# Smoke runs (e.g. `python train.py experiment=ffnn experiment.trainer.max_epochs=1
# experiment.record=false experiment.model_dir=results/models/ffnn_smoke`) skip
# submission + score writes so real artifacts are never clobbered.
record: true
model_dir: null   # null -> results/models/ffnn (runner default)
